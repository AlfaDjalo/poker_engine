name: double_board_plo
layout_name: double_board
payout_type: split_pot

hole_cards: 4

# Standard (non-bomb-pot) double-board PLO: normal pre-flop betting,
# then both boards run simultaneously street-by-street. This is the
# BASE game definition declared as rl_game_name by any double-board
# scenario (river_duo-style restricted variants included) — same role
# holdem.yaml plays for push_fold_duo/river_duo's rl_game_name: holdem
# (see training_config.yaml's own comments on that split). The trained
# policy's GameEncoder token and board/point structure are derived
# from THIS file; the actual restricted betting tree for any given
# scenario comes from its own engine_variant (e.g.
# double_board_plo_river.yaml for the river-only trainer).
board_layout:
  nodes: 10
  streets:
    0: []                     # pre-flop
    1: [0, 1, 2, 5, 6, 7]     # flop (both boards)
    2: [3, 8]                 # turn (both boards)
    3: [4, 9]                 # river (both boards)
  street_names:
    0: "pre-flop"
    1: "flop"
    2: "turn"
    3: "river"

points:
  - name: board1
    score_type: HIGH
    node_sets:
      - [0, 1, 2, 3, 4]

  - name: board2
    score_type: HIGH
    node_sets:
      - [5, 6, 7, 8, 9]

betting:
  type: pot_limit
  small_blind: 1
  big_blind: 2
  ante: 0

showdown:
  type: OMAHA

# ─────────────────────────────────────────────
# Creation phases — mirrors holdem.yaml's shape but with a single
# combined flop/turn/river deal per street (both boards dealt at once,
# same as double_board_plo_bomb_pot.yaml's DEAL_FLOP/TURN/RIVER
# phases), plus a real pre-flop betting round since this variant
# (unlike the bomb-pot version) doesn't skip straight to the flop.
# ─────────────────────────────────────────────
creation_phases:
  - id: SETUP
    label: "Setup Players"
    deals_hole: false
    deals_board_street: null
    allows_betting: false
  - id: DEAL_HOLE
    label: "Deal Hole Cards"
    deals_hole: true
    deals_board_street: null
    allows_betting: false
  - id: PREFLOP_BET
    label: "Preflop Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: DEAL_FLOP
    label: "Deal Both Flops"
    deals_hole: false
    deals_board_street: 1
    allows_betting: false
  - id: FLOP_BET
    label: "Flop Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: DEAL_TURN
    label: "Deal Both Turns"
    deals_hole: false
    deals_board_street: 2
    allows_betting: false
  - id: TURN_BET
    label: "Turn Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: DEAL_RIVER
    label: "Deal Both Rivers"
    deals_hole: false
    deals_board_street: 3
    allows_betting: false
  - id: RIVER_BET
    label: "River Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: SHOWDOWN
    label: "Showdown"
    deals_hole: false
    deals_board_street: null
    allows_betting: false