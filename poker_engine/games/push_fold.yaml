name: push_fold
layout_name: single_board
payout_type: points

# Heads-up (or multiway) push-fold: preflop is the ONLY betting round,
# using AllInOrFoldRules (kind: push_fold) — legal actions are always
# FOLD, or CALL/RAISE-as-full-shove only, never an intermediate size
# (see betting_rules.AllInOrFoldRules / flow_loader._build_betting_rules).
# The board is still dealt out (flop/turn/river, no further betting)
# so a shove-and-call resolves as a real showdown equity outcome rather
# than a hand-mask-only comparison — this is what lets
# EngineScoringEvaluator-style random-runout logic be replaced by an
# actual dealt board through the same ShowdownResolver every other
# variant uses.

node_count: 5

points:
  - name: main
    score_type: HIGH
    node_sets:
      - [0, 1, 2, 3, 4]

showdown:
  type: HOLDEM

award_last_player_next: complete

flow:
  - id: setup
    type: noop

  - id: deal_hole
    type: deal_hole_cards
    config: {count: 2, eligible: has_stack}

  - id: post_blinds
    type: post_blinds
    config: {small_blind: 1, big_blind: 2}

  - id: bet_preflop
    type: betting
    rules: {kind: push_fold}
    reset: false
    first_to_act_offset: 3
    metadata: {street_index: 0, street_name: pre-flop}

  - id: deal_flop
    type: deal
    board_nodes: [0, 1, 2]
    metadata: {street_index: 1, street_name: flop}

  - id: deal_turn
    type: deal
    board_nodes: [3]
    metadata: {street_index: 2, street_name: turn}

  - id: deal_river
    type: deal
    board_nodes: [4]
    metadata: {street_index: 3, street_name: river}

  - id: showdown
    type: showdown

  - id: complete
    type: noop
    terminal: true