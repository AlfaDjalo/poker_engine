name: double_board_plo_bomb_pot
layout_name: double_board
payout_type: split_pot

node_count: 10

points:
  - name: board1
    score_type: HIGH
    node_sets:
      - [0, 1, 2, 3, 4]
  - name: board2
    score_type: HIGH
    node_sets:
      - [5, 6, 7, 8, 9]

showdown:
  type: OMAHA

award_last_player_next: complete

# Bomb pot: antes posted automatically, both flops dealt simultaneously
# before the first (and only pre-street) betting round -- no separate
# pre-flop betting phase, unlike holdem/plo8 above.
flow:
  - id: setup
    type: noop
  - id: deal_hole
    type: deal_hole_cards
    config: {count: 4, eligible: has_stack}
  - id: post_antes
    type: post_antes
    config: {ante: 5}
  - id: deal_both_flops
    type: deal
    board_nodes: [0, 1, 2, 5, 6, 7]
    metadata: {street_index: 0, street_name: flop}
  - id: bet_flop
    type: betting
    rules: {kind: pot_limit}
    reset: false
    first_to_act_offset: 3
    metadata: {street_index: 0, street_name: flop}
  - id: deal_both_turns
    type: deal
    board_nodes: [3, 8]
    metadata: {street_index: 1, street_name: turn}
  - id: bet_turn
    type: betting
    rules: {kind: pot_limit}
    first_to_act_offset: 1
    metadata: {street_index: 1, street_name: turn}
  - id: deal_both_rivers
    type: deal
    board_nodes: [4, 9]
    metadata: {street_index: 2, street_name: river}
  - id: bet_river
    type: betting
    rules: {kind: pot_limit}
    first_to_act_offset: 1
    metadata: {street_index: 2, street_name: river}
  - id: showdown
    type: showdown
  - id: complete
    type: noop
    terminal: true