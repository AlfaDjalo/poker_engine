name: crazy_pineapple
layout_name: single_board
payout_type: points

# Crazy Pineapple: identical to Pineapple except the discard happens
# AFTER the flop is dealt and bet (with all 3 hole cards still live)
# rather than before it -- players see the flop before deciding which
# card to give up. Turn and river then play as ordinary hold'em.
#
# REWRITTEN to load via the plain flow_loader.build_flow_graph() path
# -- no custom crazy_pineapple_graph.py builder anymore. The discard
# round is expressed inline via discard_flop's own `transitions:` list,
# same proven pattern as drawmaha.yaml's discard_draw / pineapple.yaml's
# discard_preflop: set_first_to_act_discard -> begin_discard_round ->
# discard_flop (self-loop via
# `{not: {round_complete: {accessor: "active_players"}}}` until every
# eligible player has acted, then -> deal_turn).
#
# crazy_pineapple_graph.py should be deleted/renamed -- if it's still
# present, loader.py keeps preferring it over this file's own flow:
# list (documented precedence: custom builder wins whenever both
# exist), silently ignoring everything below.
#
# min_count: 1, max_count: 1, replace_from_deck: false -- same as
# pineapple's discard (exactly one card, no redraw), just positioned
# after bet_flop instead of after bet_preflop -- the ONE structural
# difference from pineapple.yaml.

node_count: 5

points:
  - name: main
    score_type: HIGH
    node_sets:
      - [0, 1, 2, 3, 4]

showdown:
  type: HOLDEM

award_last_player_next: complete

flow:
  - id: setup
    type: noop

  - id: deal_hole
    type: deal_hole_cards
    config: {count: 3, eligible: has_stack}

  - id: post_blinds
    type: post_blinds
    config: {small_blind: 1, big_blind: 2}

  - id: bet_preflop
    type: betting
    rules: {kind: no_limit}
    reset: false
    first_to_act_offset: 3
    metadata: {street_index: 0, street_name: pre-flop}

  - id: deal_flop
    type: deal
    board_nodes: [0, 1, 2]
    metadata: {street_index: 1, street_name: flop}

  - id: bet_flop
    type: betting
    rules: {kind: no_limit}
    first_to_act_offset: 1
    metadata: {street_index: 1, street_name: flop}

  - id: set_first_to_act_discard
    type: set_first_to_act
    config: {offset: 1}

  - id: begin_discard_round
    type: begin_decision_round

  - id: discard_flop
    type: card_select
    decider: current_player
    config:
      min_count: 1
      max_count: 1
      replace_from_deck: false
      eligible: active
    metadata: {street_index: -1, street_name: discard}
    transitions:
      - to: discard_flop
        when: {not: {round_complete: {accessor: "active_players"}}}
      - to: deal_turn
        when: always

  - id: deal_turn
    type: deal
    board_nodes: [3]
    metadata: {street_index: 2, street_name: turn}

  - id: bet_turn
    type: betting
    rules: {kind: no_limit}
    first_to_act_offset: 1
    metadata: {street_index: 2, street_name: turn}

  - id: deal_river
    type: deal
    board_nodes: [4]
    metadata: {street_index: 3, street_name: river}

  - id: bet_river
    type: betting
    rules: {kind: no_limit}
    first_to_act_offset: 1
    metadata: {street_index: 3, street_name: river}

  - id: showdown
    type: showdown

  - id: complete
    type: noop
    terminal: true