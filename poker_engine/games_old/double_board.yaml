name: double_board
layout_name: double_board
payout_type: points

hole_cards: 4

# Node layout: two independent 5-card boards.
#   Board 1: nodes 0-4  (flop 0,1,2 / turn 3 / river 4)
#   Board 2: nodes 5-9  (flop 5,6,7 / turn 8 / river 9)
board_layout:
  nodes: 10
  streets:
    0: []                        # pre-flop
    1: [0, 1, 2, 5, 6, 7]         # flop (both boards)
    2: [3, 8]                     # turn (both boards)
    3: [4, 9]                     # river (both boards)
  street_names:
    0: "pre-flop"
    1: "flop"
    2: "turn"
    3: "river"

points:
  - name: board1
    score_type: HIGH
    node_sets:
      - [0, 1, 2, 3, 4]
  - name: board2
    score_type: HIGH
    node_sets:
      - [5, 6, 7, 8, 9]

betting:
  type: pot_limit
  small_blind: 1
  big_blind: 2
  ante: 0

showdown:
  type: OMAHA

creation_phases:
  - id: SETUP
    label: "Setup Players"
    deals_hole: false
    deals_board_street: null
    allows_betting: false
  - id: DEAL_HOLE
    label: "Deal Hole Cards"
    deals_hole: true
    deals_board_street: null
    allows_betting: false
  - id: PREFLOP_BET
    label: "Preflop Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: DEAL_FLOP
    label: "Deal Flop"
    deals_hole: false
    deals_board_street: 1
    allows_betting: false
  - id: FLOP_BET
    label: "Flop Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: DEAL_TURN
    label: "Deal Turn"
    deals_hole: false
    deals_board_street: 2
    allows_betting: false
  - id: TURN_BET
    label: "Turn Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: DEAL_RIVER
    label: "Deal River"
    deals_hole: false
    deals_board_street: 3
    allows_betting: false
  - id: RIVER_BET
    label: "River Betting"
    deals_hole: false
    deals_board_street: null
    allows_betting: true
  - id: SHOWDOWN
    label: "Showdown"
    deals_hole: false
    deals_board_street: null
    allows_betting: false